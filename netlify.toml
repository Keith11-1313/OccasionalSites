[build]
  command = "node scripts/build-sites.js"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/mcu-watch-log"
  to = "/mcuarchive/"
  status = 301

[[redirects]]
  from = "/mcu-watch-log/*"
  to = "/mcuarchive/:splat"
  status = 301
